<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ site.description }}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" type="image/png" href="{{ '/assets/images/chip.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  </head>
  <body class="{{ page.body_class }}">
    <canvas id="bg-canvas"></canvas>
    {% include header.html %}
    <main>
      {{ content }}
    </main>
    {% include footer.html %}

    <!-- Chat Modal -->
    <div class="modal fade" id="chatModal" tabindex="-1" aria-labelledby="chatModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
        <div class="modal-content chat-modal-content">
          <div class="modal-header border-bottom-0 pb-0">
            <h5 class="modal-title d-flex align-items-center gap-2" id="chatModalLabel">
              <svg class="icon text-accent" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 2l1.7 6.1L20 10l-6.3 1.9L12 18l-1.7-6.1L4 10l6.3-1.9L12 2z"/><path d="M19 15l.8 2.7L23 18l-3.2.3L19 21l-.8-2.7L15 18l3.2-.3L19 15z"/></svg>
              <span class="text-accent">Calvin's AI Assistant</span>
            </h5>
            <button type="button" class="btn-close btn-close-white" data-modal-close aria-label="Close"></button>
          </div>
          <div class="modal-body chat-messages-container" id="chatMessages">
            <div class="chat-message bot-message">
              <div class="message-bubble greeting-bubble">
                Hi! Ask me anything about Calvin's projects, experience, or skills.
              </div>
            </div>
          </div>
          <div class="modal-footer border-top-0 pt-0">
            <div class="chat-input-wrapper w-100 position-relative">
              <input type="text" id="modalChatInput" class="form-control chat-input" placeholder="Type your question..." autocomplete="off">
              <button id="modalChatSubmit" class="btn text-accent chat-submit-btn position-absolute top-50 end-0 translate-middle-y py-0" aria-label="Send">
                <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11.5 21 3l-5.6 18-3.2-7.4L3 11.5zm6.3.2 3.9.9 1.5 3.4 2.7-8.6-8.1 4.3z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/context.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/chat.js' | relative_url }}"></script>
  </body>
</html>
