- title: Macros.cheap
  image:
    src: https://centipede5.github.io/macros_cheap/images/meta-tags.png
    alt: Macros.cheap web application interface
    width: 1200
    height: 630
  links:
    - label: Visit macros.cheap
      url: https://centipede5.github.io/macros_cheap/
  description:
    - I developed *Macros.cheap*, a Mathematical Macronutrient Cost Optimizer that helps users optimize their nutrition while minimizing grocery costs.
    - Built the optimizer with GLPK and WASM so users can turn nutrition targets and grocery prices into budget-aware meal plans.
    - "The core philosophy is simple: Eat well, spend less!"
