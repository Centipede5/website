  role: Software Engineering Contractor - Application Development
  summary:
    - Developing a web interface for the MARCH centralized model archival and retrieval system, including role-based access control, version-controlled model storage, and model exploration tools.
    - Building a Dockerized Python web app that retrieves manufacturing data from Databricks and automatically generates editable model maintenance reports with charts, statistical analyses, and narrative summaries.
    - Built a guardrailed GenAI agent to extract structured data from handwritten paper batch records with 1/20th the error of Copilot alone, plus a companion review app that sped up human review versus manual extraction.
    - Extended the internal application framework built during my Co-Op with interactive documentation, Jenkins CI/CD integration, Databricks/Teradata connections, FastAPI support, and HTMX interactivity.
    - Built and deployed tools for device design-space search, filter adsorption modeling, MSAT pathmapping, and intensified perfusion process monitoring.
